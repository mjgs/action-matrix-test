name: 🧩 Dynamic Matrix Generation Example

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Job to generate the dynamic configuration data (JSON)
  generate_matrix:
    runs-on: ubuntu-latest
    
    outputs:
      matrix_json: ${{ steps.set_matrix.outputs.matrix_data }}
      
    steps:
      - name: Create and Export JSON Matrix
        id: set_matrix
        run: |
          # Step 1: Define the JSON data in a shell variable.
          # We use single quotes (') to prevent the shell from expanding any variables inside the JSON.
          JSON_CONTENT='
            [
              {"project": "client-portal", "env": "stage", "test-type": "smoke"},
              {"project": "data-api", "env": "prod", "test-type": "integration"},
              {"project": "data-api", "env": "stage", "test-type": "unit"},
              {"project": "client-portal", "env": "prod", "test-type": "e2e"}
            ]
          '
          
          # Step 2: Write the multiline output to GITHUB_OUTPUT.
          # We use the recommended multiline format with the EOF delimiter.
          # The -e flag on echo is sometimes necessary to handle multi-line strings correctly.
          echo "matrix_data<<EOF" >> $GITHUB_OUTPUT
          echo "$JSON_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # 2. Job to consume the generated JSON and run the parallel jobs
  dynamic_job:
    runs-on: ubuntu-latest
    
    needs: generate_matrix 
    
    strategy:
      matrix:
        # Use fromJSON() to parse the output string into an array of configurations.
        include: ${{ fromJSON(needs.generate_matrix.outputs.matrix_json) }}
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Test/Deploy Step
        run: |
          echo "--- Configuration Summary ---"
          echo "Project: ${{ matrix.project }}"
          echo "Environment: ${{ matrix.env }}"
          echo "Test Type: ${{ matrix.test-type }}"
          echo "---------------------------"
