name: 🧩 Dynamic Matrix Generation Example

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Job to generate the dynamic configuration data (JSON)
  generate_matrix:
    runs-on: ubuntu-latest
    
    outputs:
      matrix_json: ${{ steps.set_matrix.outputs.matrix_data }}
      
    steps:
      - name: Create and Export JSON Matrix
        id: set_matrix
        run: |
          # Step 1: Define the multi-line JSON and write it to a temporary file.
          cat > /tmp/matrix.txt <<- EOF_JSON
            [
              {"project": "client-portal", "env": "stage", "test-type": "smoke"},
              {"project": "data-api", "env": "prod", "test-type": "integration"},
              {"project": "data-api", "env": "stage", "test-type": "unit"},
              {"project": "client-portal", "env": "prod", "test-type": "e2e"}
            ]
          EOF_JSON

          # Step 2: Use jq to read the temporary file and output compact, single-line JSON.
          JSON_CONTENT=$(jq -c . /tmp/matrix.txt)

          # Optional: Print the compact JSON for debugging purposes.
          echo "DEBUG: JSON_CONTENT (compact): <$JSON_CONTENT>"

          # Step 3: Write the compact JSON content to GITHUB_OUTPUT using the multiline format.
          echo "matrix_data<<EOF" >> $GITHUB_OUTPUT
          echo "$JSON_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # 2. Job to consume the generated JSON and run the parallel jobs
  # The run time name now includes the dynamic matrix variables
  dynamic_job:
    name: Deploy/Test ${{ matrix.post.project }} - ${{ matrix.post.env }}
    
    needs: generate_matrix 
    
    # ⚠️ We do NOT use runs-on here because we are using 'uses:'
    # runs-on: ubuntu-latest 

    strategy:
      matrix:
        # Use fromJSON() to parse the output string into an array of configurations.
        post: ${{ fromJSON(needs.generate_matrix.outputs.matrix_json) }}
        
    # Call the reusable workflow instead of running steps
    uses: ./.github/workflows/deployProject.yml
    with:
      # Map the dynamic matrix variables to the workflow inputs
      project_name: ${{ matrix.post.project }}
      environment: ${{ matrix.post.env }}
      test_type: "${{ matrix.post['test-type'] }}"
